[package]
name = "tau-verifier"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Mikhail Kostan <architect@auriglyph.com>"]
description = "Public verifier for the TDX semantic compression engine. Independent re-implementation of TSC witness verification, block integrity checks, and metadata peek — depends only on sha2 + primitive-types."
license-file = "LICENSE"
repository = "https://github.com/auriglyph/ag-tau"
readme = "README.md"
keywords = ["tdx", "ethereum", "verifier", "compression", "merkle"]
categories = ["cryptography", "no-std"]
publish = false

[features]
default = []
std = []


[dependencies]
sha2 = { version = "0.11", default-features = false }
primitive-types = { version = "0.14", default-features = false }

[workspace]

